[project]
name = "cardiosync-ai-framingham"
version = "0.1.0"
description = "Framingham Heart Study - 10-Year CHD Risk Prediction with Clinical AI"
authors = [
    {name = "Your Name", email = "your.email@example.com"}
]
requires-python = ">=3.10"
readme = "README.md"
license = {text = "MIT"}

dependencies = [
    "pandas>=2.3.0",
    "numpy>=2.2.0",
    "scikit-learn>=1.6.0",
    "imbalanced-learn>=0.13.0",
    "xgboost>=2.1.0",
    "catboost>=1.2.10",
    "optuna>=4.4.0",
    "shap>=0.48.0",
    "matplotlib>=3.10.0",
    "seaborn>=0.13.0",
    "jupyter>=1.1.1",
    "ipykernel>=6.29.0",
    "ipywidgets>=8.1.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.35.0",
    "pydantic>=2.11.0",
    "python-multipart>=0.0.20",
    "joblib>=1.5.0",
    "requests>=2.32.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "ruff>=0.6.0",
    "mypy>=1.13.0",
]

aws = [
    "boto3>=1.39.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cardiosync_ai_framingham"]

[tool.uv]
dev-dependencies = []

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
